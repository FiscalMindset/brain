# SecondBrain Alembic configuration
#
# Usage (from apps/api/):
#   alembic upgrade head
#   ALEMBIC_URL=sqlite:///./tmp.db python -m alembic upgrade head
#   DATABASE_URL=sqlite:///./tmp.db python -m alembic upgrade head
#
# The database URL is read from app.core.config.settings (DATABASE_URL
# env var), so alembic always targets the same database as the app.

[alembic]
# Location of the version table. ``script_location`` points at the
# directory containing env.py and versions/.
script_location = alembic

# Template for revision filenames.
prepend_sys_path = .
path_separator = os
sqlalchemy.url = sqlite:///./secondbrain.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
